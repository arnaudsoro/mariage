<style>
:root{
  --cream:#f6eee2; --sand:#ecdfcc; --terra:#b9532f; --terra-d:#9a4224; --terra-l:#c86a45;
  --brown:#3a2118; --ink:#4a2e22; --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:300 1.0625rem/1.7 'Jost',system-ui,sans-serif;overflow-x:hidden}
body.locked{overflow:hidden;height:100%}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:.8em 2em;border-radius:999px;border:1px solid var(--terra);background:var(--terra);color:var(--cream);font:500 .95rem 'Jost',sans-serif;letter-spacing:.08em;text-decoration:none;cursor:pointer;transition:background .6s var(--ease),color .6s var(--ease),transform .6s var(--ease)}
.btn:hover{background:var(--terra-d)}
.btn.ghost{background:transparent;color:var(--terra)}
.btn.ghost:hover{background:var(--terra);color:var(--cream)}
.btn.light{background:var(--cream);color:var(--brown);border-color:var(--cream)}
.btn.light:hover{background:var(--sand)}

/* ---------- Enveloppe ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2rem;padding:2rem 1.25rem;background:radial-gradient(ellipse at 50% 40%,#4b2c20,var(--brown) 70%);transition:opacity 1.6s ease}
#intro.leave{opacity:0;pointer-events:none}
.stage{perspective:1100px;margin-top:3rem}
.env{position:relative;width:min(86vw,360px);aspect-ratio:3/2}
.env>*{position:absolute}
.env-back{inset:0;background:var(--terra-d);border-radius:4px}
.card{left:6%;right:6%;top:5%;height:92%;z-index:2;background:var(--cream);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1.1rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.2);transition:transform 1.5s var(--ease) .9s}
.card .ini{font:2.6rem/1 'Pinyon Script',cursive;color:var(--terra)}
.card .sub{font:400 .72rem 'Cinzel',serif;letter-spacing:.2em;color:var(--ink);margin-top:.5rem}
.env-front{inset:0;z-index:3;background:var(--terra);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:4px}
.flap{left:0;right:0;top:0;height:55%;z-index:4;background:var(--terra-l);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s var(--ease),z-index 0s .5s}
.seal{left:50%;top:54%;z-index:5;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a3a24,#4a2014 70%);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.07);display:grid;place-items:center;font:1.5rem/1 'Pinyon Script',cursive;color:var(--cream);transition:opacity .5s ease,transform .8s var(--ease)}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0;transform:scale(.7)}
.open .card{transform:translateY(-62%)}
.leave .card{transform:translateY(-62%) scale(1.6)}
#openBtn{transition:opacity .6s ease}
.open+#openBtn{opacity:0;pointer-events:none}

/* ---------- Mise en page ---------- */
section{padding:5.5rem 1.5rem;text-align:center}
.wrap{max-width:560px;margin:0 auto}
h2{font:400 clamp(2.1rem,9vw,3rem)/1.15 'Bodoni Moda',serif;color:var(--brown);margin-bottom:2.5rem}
.small{font:400 .85rem 'Cinzel',serif;letter-spacing:.16em;color:var(--terra)}
.alt{background:var(--sand)}
.dark{background:var(--brown);color:var(--cream)}
.dark h2{color:var(--cream)}

/* ---------- Accueil ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4rem 1.25rem 2.5rem;color:var(--cream);overflow:hidden;text-align:center}
.hero-bg{position:absolute;inset:0;background:var(--brown)}
.hero-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 12s ease-out}
.ready .hero-bg img{transform:scale(1)}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(58,33,24,.55),rgba(58,33,24,.35) 40%,rgba(58,33,24,.8))}
.hero>*:not(.hero-bg){position:relative}
.hero .small{color:var(--cream);opacity:.9}
.names{font:clamp(3.8rem,21vw,7.5rem)/.95 'Pinyon Script',cursive;margin:1.4rem 0 .6rem;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.names span{display:block}
.names .et{font-size:.5em;line-height:1.1;opacity:.9}
.hero .date{font:400 1rem 'Cinzel',serif;letter-spacing:.14em}
.hero .phrase{max-width:21rem;margin:1.4rem auto 0;font-size:1.1rem}
.count{display:flex;gap:.7rem;margin-top:2.4rem;justify-content:center}
.count div{width:4.3rem;padding:.8rem 0 .6rem;border:1px solid rgba(246,238,226,.45);border-radius:2px;background:rgba(58,33,24,.35);backdrop-filter:blur(3px)}
.count b{display:block;font:400 1.9rem/1 'Bodoni Moda',serif;font-variant-numeric:tabular-nums}
.count small{font:400 .62rem 'Cinzel',serif;letter-spacing:.14em}
.hero .sequence{opacity:0;transform:translateY(22px);transition:opacity 1.8s var(--ease),transform 1.8s var(--ease)}
.ready .hero .sequence{opacity:1;transform:none}

/* ---------- Histoire ---------- */
.tl{position:relative;text-align:left;margin:0 auto;max-width:460px;padding-left:2.6rem}
.tl::before,.tl i{content:"";position:absolute;left:.62rem;top:.4rem;bottom:.4rem;width:1px;background:rgba(74,46,34,.25)}
.tl i{background:var(--terra);transform-origin:top;transform:scaleY(var(--p,0))}
.step{position:relative;padding-bottom:3rem}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:-2.6rem;top:.55rem;width:15px;height:15px;border-radius:50%;background:var(--cream);border:1px solid var(--terra);transition:background 1.2s ease,transform 1.2s var(--ease)}
.step.in::before{background:var(--terra);transform:scale(1.15)}
.step h3{font:400 1.6rem/1.2 'Bodoni Moda',serif;color:var(--brown);margin:.3rem 0 .5rem}

/* ---------- Galerie (carrousel qui tourne de gauche à droite) ---------- */
.cf{position:relative;perspective:900px;aspect-ratio:1/.9;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cs{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:4/5;border-radius:3px;overflow:hidden;background:var(--sand);box-shadow:0 14px 34px rgba(58,33,24,.28);transition:transform 1.4s var(--ease),opacity 1.4s var(--ease);will-change:transform}
.cs img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.cf-ui{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-top:1.4rem}
.cf-ui>button{width:44px;height:44px;border-radius:50%;border:1px solid var(--terra);background:none;color:var(--terra);font:1.6rem/1 'Bodoni Moda',serif;cursor:pointer;padding:0 0 .2rem;transition:background .5s,color .5s}
.cf-ui>button:hover{background:var(--terra);color:var(--cream)}
.cdots{display:flex;gap:.2rem;align-items:center}
.cd{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;position:relative}
.cd::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:99px;background:rgba(74,46,34,.3);transition:width .6s var(--ease),margin .6s var(--ease),background .6s}
.cd.on::after{width:22px;margin-left:-11px;background:var(--terra)}

/* ---------- Programme ---------- */
.prog{list-style:none;margin:0 auto;padding:0;max-width:460px;text-align:left}
.prog li{display:grid;grid-template-columns:4.2rem 1fr;gap:0 1.2rem;padding:1.3rem 0;border-top:1px solid rgba(74,46,34,.2)}
.prog li:last-child{border-bottom:1px solid rgba(74,46,34,.2)}
.prog time{font:500 1.05rem/1.9 'Cinzel',serif;color:var(--terra)}
.prog h3{font:400 1.4rem/1.3 'Bodoni Moda',serif;color:var(--brown)}
.prog p{font-size:1rem}

/* ---------- Lieu ---------- */
.addr{font-size:1.1rem;margin-bottom:1.6rem}
.addr strong{display:block;font:400 1.5rem 'Bodoni Moda',serif;color:var(--brown);margin-bottom:.2rem}
.map{width:100%;aspect-ratio:4/3;border:0;border-radius:2px;margin-bottom:1.8rem;filter:sepia(.25) saturate(.9)}

/* ---------- Tenue ---------- */
.dots{display:flex;justify-content:center;gap:1.6rem;margin-top:2rem}
.dot{display:flex;flex-direction:column;align-items:center;gap:.6rem;font:400 .75rem 'Cinzel',serif;letter-spacing:.12em}
.dot span{width:58px;height:58px;border-radius:50%;box-shadow:0 0 0 4px var(--cream),0 0 0 5px rgba(74,46,34,.3)}

/* ---------- RSVP / pied ---------- */
.dark .small{color:#e0a487}
.dark .deadline{font:400 1.7rem 'Bodoni Moda',serif;margin:.4rem 0 2rem}
footer{padding:4.5rem 1.5rem calc(3.5rem + env(safe-area-inset-bottom));text-align:center;background:var(--brown);color:var(--cream);border-top:1px solid rgba(246,238,226,.15)}
footer .ini{font:4rem/1 'Pinyon Script',cursive;margin:1.4rem 0 .6rem}
footer p.t{font:400 1.5rem/1.3 'Bodoni Moda',serif;font-style:italic}

/* ---------- Livre d’or ---------- */
.gb-lead{max-width:30rem;margin:-1rem auto 2rem}
.gb{display:grid;gap:.9rem;text-align:left}
.gb input,.gb textarea{width:100%;min-height:50px;padding:.75rem 1rem;border:1px solid rgba(74,46,34,.25);border-radius:4px;background:var(--cream);color:var(--ink);font:400 1rem 'Jost',sans-serif}
.gb textarea{min-height:120px;resize:vertical}
.gb-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.gb-row small{color:rgba(74,46,34,.7)}
.gb-note{min-height:1.5rem;font-size:.95rem;color:var(--terra);text-align:center}
.gb-list{display:grid;gap:1rem;margin-top:1.6rem;text-align:left}
.gb-msg{background:var(--cream);border-left:2px solid var(--terra);padding:1.1rem 1.3rem;border-radius:2px;animation:gbin 1s var(--ease)}
.gb-msg .small{margin-bottom:.4rem}
.gb-txt{font:italic 400 1.2rem/1.5 'Bodoni Moda',serif;color:var(--brown);overflow-wrap:anywhere;white-space:pre-line}
.gb-empty{text-align:center;font-style:italic;opacity:.8}
@keyframes gbin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Bouton musique ---------- */
#mus{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:60;width:48px;height:48px;border-radius:50%;border:1px solid rgba(246,238,226,.5);background:rgba(58,33,24,.82);color:var(--cream);font:1.3rem/1 'Bodoni Moda',serif;cursor:pointer;display:none;place-items:center;backdrop-filter:blur(4px);transition:opacity .6s ease}
.ready #mus{display:grid}
#mus.off{opacity:.7}
#mus.off::after{content:"";position:absolute;width:26px;height:1.5px;background:var(--cream);transform:rotate(-45deg)}

/* ---------- Apparitions ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.5s var(--ease),transform 1.5s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.15em;margin-bottom:-.15em}
.w>span{display:inline-block;transform:translateY(115%);transition:transform 1.2s var(--ease);transition-delay:calc(var(--i)*100ms)}
.in .w>span{transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv,.hero .sequence{opacity:1;transform:none}
  .w>span{transform:none}
  .hero-bg img{transform:none}
}
</style>
</head>
<body class="locked">

<!-- Enveloppe d’ouverture -->
<div id="intro">
  <div class="stage">
    <div class="env" id="env">
      <div class="env-back"></div>
      <div class="card"><div class="ini" data-ini2></div><div class="sub" data-t="carteTexte"></div></div>

  <section id="histoire"><div class="wrap">

  <section id="tenue"><div class="wrap">

  </div></section>

  <section id="rsvp" class="dark"><div class="wrap">
    <h2 data-split data-t="rsvpTitre"></h2>
    <p class="small rv" data-t="rsvpTexte"></p>
    <p class="deadline rv" data-t="rsvpDate"></p>
    <a class="btn light rv" id="rsvpBtn" target="_blank" rel="noopener">Répondre à l’invitation</a>
  </div></section>

  <section id="livre" class="alt"><div class="wrap">
    <h2 data-split data-t="livreTitre"></h2>
    <p class="gb-lead rv" data-t="livreTexte"></p>
    <div class="gb rv">
      <input id="gb-nom" maxlength="40" placeholder="Votre nom" autocomplete="name" aria-label="Votre nom">
      <textarea id="gb-msg" maxlength="300" placeholder="Votre message pour les mariés…" aria-label="Votre message"></textarea>

    <div class="gb-list" id="gb-list" aria-live="polite"></div>

</main>

<footer>
  <p class="t rv" data-t="merci"></p>
  <div class="ini rv" data-ini2></div>
  <p class="small rv" style="color:#e0a487" data-t="hashtag"></p>
</footer>
<button id="mus" type="button" aria-pressed="true" aria-label="Couper la musique">♪</button>

<script>
(function(){
  var S = SITE, $ = function(s,r){return (r||document).querySelector(s)}, $$ = function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var enc = encodeURIComponent, adr = S.salle+', '+S.adresse+', '+S.ville;

  /* Recherche automatique des fichiers : si le dossier ou l'extension diffère, le site essaie les autres possibilités */
  function cands(path,dirs,exts){
    var m = path.match(/^(.*\/)?([^\/]*?)(\.[A-Za-z0-9]+)?$/), dir = m[1]||'', base = m[2], ext = m[3]||'', out = [path];
    [dir].concat(dirs).forEach(function(d){ [ext].concat(exts).forEach(function(x){ var q = d+base+x; if(x && out.indexOf(q)<0) out.push(q); }); });
    return out;
  }
  function smartImg(img,path){
    var l = cands(path,['photos/','galerie/','images/','img/',''],['.jpg','.jpeg','.png','.webp','.JPG','.JPEG','.PNG']), k = 0;
    img.onerror = function(){ k++; if(k<l.length) img.src = l[k]; else { img.onerror = null; console.warn('Photo introuvable : '+path); } };
    img.src = l[0];
  }

  /* Textes simples */
  $$('[data-t]').forEach(function(e){ e.textContent = S[e.dataset.t]; });
  var ini = S.prenom1.charAt(0).toUpperCase()+' & '+S.prenom2.charAt(0).toUpperCase();
  $$('[data-ini]').forEach(function(e){ e.textContent = S.prenom1.charAt(0).toUpperCase()+S.prenom2.charAt(0).toUpperCase(); });
  $$('[data-ini2]').forEach(function(e){ e.textContent = ini; });
  document.title = S.prenom1+' & '+S.prenom2+' · Invitation de mariage';
  smartImg($('#heroImg'), S.photoAccueil);

  /* Listes */
  $('#tl').insertAdjacentHTML('beforeend', S.histoire.map(function(h,i){
    return '<div class="step rv"><p class="small">'+h.date+'</p><h3>'+h.titre+'</h3><p>'+h.texte+'</p></div>';
  }).join(''));
  /* Carrousel : les photos tournent de gauche à droite */
  var cf = $('#cf'), n = S.galerie.length, cur = 0, pos = [], cInView = true, cPause = 0;
  var slides = S.galerie.map(function(src,i){
    var f = document.createElement('div'); f.className = 'cs';
    var im = document.createElement('img'); smartImg(im, src); im.alt = 'Photo '+(i+1); im.decoding = 'async'; f.appendChild(im); cf.appendChild(f); return f;
  });
  $('#cdots').innerHTML = slides.map(function(_,i){ return '<button class="cd" type="button" aria-label="Photo '+(i+1)+'"></button>'; }).join('');
  var cds = $$('.cd');
  function place(el,d){
    var a = Math.abs(d);
    el.style.transform = 'translate(-50%,-50%) translateX('+(d*72)+'%) rotateY('+(-d*32)+'deg) scale('+(1-.16*Math.min(a,2))+')';
    el.style.opacity = a>1 ? 0 : (a===0 ? 1 : .6);
    el.style.zIndex = 10-Math.min(a,5);
    el.style.pointerEvents = 'none';
  }
  function render(step){
    slides.forEach(function(el,i){
      var d = ((i-cur)%n+n)%n; if(d>n/2) d -= n;
      if(pos[i]!==undefined && Math.abs(d-pos[i])>1){ el.style.transition='none'; place(el,d-step); void el.offsetWidth; el.style.transition=''; }
      place(el,d); pos[i]=d;
    });
    cds.forEach(function(x,i){ x.classList.toggle('on', i===cur); });
  }
  function goTo(delta){ cur = ((cur+delta)%n+n)%n; render(delta>0?-1:1); }
  function userPause(){ cPause = Date.now()+8000; }
  render(1);
  $('#cprev').onclick = function(){ userPause(); goTo(-1); };
  $('#cnext').onclick = function(){ userPause(); goTo(1); };
  cds.forEach(function(x,i){ x.onclick = function(){ userPause(); goTo(i-cur); }; });
  var sx = null;
  cf.addEventListener('pointerdown', function(e){ sx = e.clientX; });
  cf.addEventListener('pointerup', function(e){
    if(sx===null) return; var dx = e.clientX - sx; sx = null;
    if(Math.abs(dx)>40){ userPause(); goTo(dx>0 ? -1 : 1); }
  });
  if('IntersectionObserver' in window) new IntersectionObserver(function(e){ cInView = e[0].isIntersecting; }).observe(cf);
  if(!reduce) setInterval(function(){ if(cInView && !document.hidden && Date.now()>=cPause) goTo(-1); }, 3800);
  $('#prog').innerHTML = S.programme.map(function(p){
    return '<li class="rv"><time>'+p.heure+'</time><div><h3>'+p.titre+'</h3><p>'+p.texte+'</p></div></li>';
  }).join('');
  $('#dots').innerHTML = S.couleurs.map(function(c){
    return '<div class="dot"><span style="background:'+c.hex+'"></span>'+c.nom+'</div>';
  }).join('');
  $('#map').src = 'https://www.google.com/maps?q='+enc(adr)+'&output=embed';
  $('#route').href = 'https://www.google.com/maps/dir/?api=1&destination='+enc(adr);
  $('#rsvpBtn').href = S.rsvpLien;

  /* Titres mot par mot */
  $$('[data-split]').forEach(function(h){
    var words = h.textContent.trim().split(/\s+/);
    h.innerHTML = words.map(function(w,i){ return '<span class="w" style="--i:'+i+'"><span>'+w+'</span></span>'; }).join(' ');
    h.classList.add('rv-t');
  });

  /* Décalage léger entre blocs voisins */
  $$('.gal .rv, .tl .rv, .prog .rv').forEach(function(e){ e.style.setProperty('--d','0s'); });

  /* Compte à rebours */
  var target = new Date(S.dateISO).getTime(), u = {};
  $$('[data-u]').forEach(function(e){ u[e.dataset.u] = e; });
  function tick(){
    var t = Math.max(0, target - Date.now()), s = Math.floor(t/1000);
    u.d.textContent = Math.floor(s/86400);
    u.h.textContent = String(Math.floor(s%86400/3600)).padStart(2,'0');
    u.m.textContent = String(Math.floor(s%3600/60)).padStart(2,'0');
    u.s.textContent = String(s%60).padStart(2,'0');
  }
  tick(); setInterval(tick, 1000);

  /* Apparition au défilement */
  function startReveal(){
    var els = $$('.rv, .rv-t');
    if(reduce || !('IntersectionObserver' in window)){ els.forEach(function(e){e.classList.add('in')}); return; }
    var io = new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } });
    }, {threshold:.15, rootMargin:'0px 0px -6% 0px'});
    els.forEach(function(e){ io.observe(e); });
  }

  /* Frise qui se dessine + profondeur de la galerie */
  var tl = $('#tl'), tlLine = $('i', tl), frames = $$('.frame img'), ticking = false;
  function onScroll(){
    ticking = false;
    var vh = innerHeight, r = tl.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (vh*.7 - r.top) / r.height));
    tlLine.style.setProperty('--p', reduce ? 1 : p);
    if(reduce) return;
    frames.forEach(function(img){
      var b = img.parentNode.getBoundingClientRect();
      if(b.bottom < -50 || b.top > vh+50) return;
      var q = Math.max(-1, Math.min(1, (b.top + b.height/2 - vh/2) / vh));
      img.style.transform = 'translate3d(0,'+(q*-6).toFixed(2)+'%,0)';
    });
  }
  addEventListener('scroll', function(){ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, {passive:true});
  addEventListener('resize', onScroll);

  /* Livre d’or */
  var gbKey = 'livreor-'+S.prenom1+S.prenom2, gbMsgs = [], gbShared = !!S.livreOrUrl;
  function gbDate(t){ try{ return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } }
  function gbRender(){
    var box = $('#gb-list'); box.textContent = '';
    if(!gbMsgs.length){ var p = document.createElement('p'); p.className = 'gb-empty'; p.textContent = 'Soyez le premier à laisser un mot aux mariés.'; box.appendChild(p); return; }
    gbMsgs.slice(0,50).forEach(function(m){
      var d = document.createElement('div'), h = document.createElement('p'), t = document.createElement('p');
      d.className = 'gb-msg'; h.className = 'small'; t.className = 'gb-txt';
      h.textContent = m.nom+' · '+gbDate(m.date); t.textContent = m.msg;
      d.appendChild(h); d.appendChild(t); box.appendChild(d);
    });
  }
  if(gbShared){
    fetch(S.livreOrUrl).then(function(r){ return r.json(); }).then(function(a){
      if(Array.isArray(a)){ gbMsgs = a.filter(function(m){ return m && m.nom && m.msg; }).sort(function(x,y){ return y.date-x.date; }); gbRender(); }
    }).catch(function(){});
  } else { try{ gbMsgs = JSON.parse(localStorage.getItem(gbKey)||'[]'); }catch(e){ gbMsgs = []; } }
  gbRender();
  $('#gb-msg').addEventListener('input', function(){ $('#gb-count').textContent = this.value.length+'/300'; });
  $('#gb-send').addEventListener('click', function(){
    var nom = $('#gb-nom').value.trim().slice(0,40), msg = $('#gb-msg').value.trim().slice(0,300), note = $('#gb-note'), b = this;
    if(!nom || !msg){ note.textContent = 'Merci d’écrire votre nom et votre message.'; return; }
    var m = {nom:nom, msg:msg, date:Date.now()};
    gbMsgs.unshift(m); gbRender();
    $('#gb-msg').value = ''; $('#gb-count').textContent = '0/300'; note.textContent = 'Merci pour votre message ♥';
    b.disabled = true; setTimeout(function(){ b.disabled = false; }, 3000);
    if(gbShared){ fetch(S.livreOrUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(m)}).catch(function(){ note.textContent = 'Message affiché, mais l’envoi a échoué. Réessayez plus tard.'; }); }
    else { try{ localStorage.setItem(gbKey, JSON.stringify(gbMsgs.slice(0,50))); }catch(e){} }
  });

  /* Sons et musique */
  var AC=null, master=null, musicOn=true, started=false, fileAudio=null, genActive=false, genTimer=null, fadeT=null;
  function initAudio(){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0; master.connect(AC.destination); AC.resume(); }catch(e){ AC=null; }
  }
  function noise(dur,shape){
    var n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*shape(i/n);
    var s=AC.createBufferSource(); s.buffer=b; return s;
  }
  function rustle(){          /* froissement du papier */
    if(!AC) return;
    var s=noise(.9,function(x){return Math.pow(Math.random(),2.5)*Math.sin(Math.PI*Math.min(1,x*1.1))});
    var f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800;
    var g=AC.createGain(); g.gain.value=.9;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  }
  function whoosh(){          /* la carte glisse hors de l’enveloppe */
    if(!AC) return;
    var t=AC.currentTime, s=noise(1.3,function(x){return Math.sin(Math.PI*x)});
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8;
    f.frequency.setValueAtTime(700,t); f.frequency.exponentialRampToValueAtTime(2600,t+1.3);
    var g=AC.createGain(); g.gain.value=.22;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
  }
  function chime(){           /* petit carillon final */
    if(!AC) return;
    [1318.5,1760,2093].forEach(function(fr,i){
      var t=AC.currentTime+i*.13, o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=fr;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.09,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+1.8);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+1.9);
    });
  }
  function fade(to,sec){      /* 0 = silence, 1 = volume normal */
    if(master){ var t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(to*.9,t+sec); }
    if(fileAudio && !genActive){
      var from=fileAudio.volume, n=0; clearInterval(fadeT);
      fadeT=setInterval(function(){ n++; fileAudio.volume=Math.max(0,Math.min(1,from+(to*.6-from)*n/20)); if(n>=20) clearInterval(fadeT); }, sec*50);
    }
  }
  function startGen(){        /* mélodie douce intégrée (si aucun fichier musique) */
    if(genActive||!AC) return; genActive=true;
    var beat=60/64, chords=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
    var bus=AC.createGain(), dl=AC.createDelay(), fb=AC.createGain(), wet=AC.createGain();
    dl.delayTime.value=.45; fb.gain.value=.4; wet.gain.value=.5;
    bus.connect(master); bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
    function note(m,t,dur,vol,type){
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=440*Math.pow(2,(m-69)/12);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+.05);
    }
    var next=AC.currentTime+.1, step=0, arp=[0,1,2,1,2,1,2,1];
    genTimer=setInterval(function(){
      while(next<AC.currentTime+1.2){
        var c=chords[Math.floor(step/8)%4], i=step%8;
        if(i===0) note(c[0]-12,next,3.6,.09,'sine');
        note(c[arp[i]]+12,next,1.6,.07,'triangle');
        if(i%4===0) note(c[2]+24,next,2.4,.035,'sine');
        next+=beat/2; step++;
      }
    },300);
  }
  function useGen(){ if(genActive||!AC) return; if(fileAudio) fileAudio.pause(); startGen(); fade(musicOn?1:0,3); }
  function startMusic(){
    if(started||(!AC&&!S.musique)) return; started=true;
    if(!S.musique){ startGen(); }
    else{
      var list=cands(S.musique,['audio/','musique/','sons/',''],['.mp3','.MP3','.m4a','.ogg','.wav']), k=0;
      fileAudio=new Audio(list[0]); fileAudio.loop=true; fileAudio.volume=0;
      fileAudio.addEventListener('error',function(){
        k++; if(k<list.length){ fileAudio.src=list[k]; var q=fileAudio.play(); if(q&&q.catch) q.catch(function(){}); } else useGen();
      });
      var p=fileAudio.play(); if(p&&p.catch) p.catch(function(){});
    }
    setTimeout(function(){ fade(musicOn?1:0,4); },1200);
  }
  var mus=$('#mus');
  mus.addEventListener('click',function(){
    musicOn=!musicOn; mus.classList.toggle('off',!musicOn);
    mus.setAttribute('aria-pressed',musicOn); mus.setAttribute('aria-label',musicOn?'Couper la musique':'Activer la musique');
    if(musicOn&&fileAudio&&!genActive) fileAudio.play().catch(function(){});
    fade(musicOn?1:0,.8);
  });
  document.addEventListener('visibilitychange',function(){
    if(!started) return;
    if(document.hidden){ if(fileAudio) fileAudio.pause(); if(AC) AC.suspend(); }
    else{ if(AC) AC.resume(); if(fileAudio&&musicOn&&!genActive) fileAudio.play().catch(function(){}); }
  });

  /* Ouverture de l’enveloppe */
  var intro = $('#intro'), env = $('#env'), btn = $('#openBtn');
  /* Défilement automatique lent après l'ouverture de l'invitation */
  var autoScrollFrame = null, autoScrollLast = 0, autoScrollPausedUntil = 0;
  var autoScrollSpeed = 70; // pixels par seconde : augmentez pour aller plus vite, diminuez pour ralentir
  function pauseAutoScroll(){ autoScrollPausedUntil = Date.now() + 8000; }
  function autoScrollStep(now){
    if(!autoScrollLast) autoScrollLast = now;
    var elapsed = Math.min((now - autoScrollLast) / 1000, 0.10);
    autoScrollLast = now;
    if(Date.now() >= autoScrollPausedUntil){
      var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if(window.scrollY < maxScroll - 2){
        window.scrollTo({top: Math.min(maxScroll, window.scrollY + autoScrollSpeed * elapsed), behavior: 'instant'});
      } else {
        autoScrollFrame = null;
        return; // s'arrête en bas de la page
      }
    }
    autoScrollFrame = requestAnimationFrame(autoScrollStep);
  }
  function startAutoScroll(){
    if(autoScrollFrame !== null || reduce) return;
    autoScrollLast = 0;
    autoScrollFrame = requestAnimationFrame(autoScrollStep);
  }
  ['wheel','touchstart','pointerdown','keydown'].forEach(function(evt){
    addEventListener(evt, pauseAutoScroll, {passive:true});
  });
  /* Dès que l'invité écrit dans le livre d'or, le défilement automatique s'arrête pour de bon */
  addEventListener('focusin', function(e){ if(e.target.closest && e.target.closest('#livre')) autoScrollPausedUntil = Infinity; });

  function finish(){
    intro.remove(); document.body.classList.remove('locked'); document.body.classList.add('ready');
    scrollTo(0,0); startReveal(); onScroll(); startAutoScroll();
  }
  btn.addEventListener('click', function(){
    btn.disabled = true;
    initAudio(); rustle(); startMusic();   /* à faire pendant le clic */
    if(reduce){ finish(); return; }
    env.classList.add('open');
    setTimeout(whoosh, 900);
    setTimeout(function(){ intro.classList.add('leave'); chime(); }, 3300);
    setTimeout(finish, 5000);
  });
  btn.focus({preventScroll:true});
})();
</script>
</body>
</html>
